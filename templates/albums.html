{% extends "base.html" %}

{% block content %}
    <h1>Albums</h1>
    <hr>
    {% for album in albums %}
        <div>
            <p>Title: {{ album.title }}</p>
            <p>Released: {{ album.release_year }}</p>
            <a href="/albums/{{album.id}}">go to album</a>
            <hr>
        </div>
    {% endfor %}
{% endblock %}
