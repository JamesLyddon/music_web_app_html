{% extends "base.html" %}

{% block content %}
    <h1>Artists</h1>
    <hr>
    {% for artist in artists %}
        <div>
            <p>Name: {{ artist.name }}</p>
            <p>Genre: {{ artist.genre }}</p>
            <a href="/albums/{{artist.id}}">go to artist</a>
            <hr>
        </div>
    {% endfor %}
    <a href="/artists/new">Add a new artist</a>
{% endblock %}
